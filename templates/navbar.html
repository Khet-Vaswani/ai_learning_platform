<!-- StudyWise Navbar -->
<nav class="navbar-modern" id="mainNavbar">
    <div class="navbar-container">
        <!-- Left Section: Brand Identity -->
        <div class="navbar-left">
            <button class="nav-action-btn sidebar-toggle-btn" id="sidebarToggleBtn" onclick="toggleSidebar()" title="Toggle Sidebar">
                <i class="fas fa-bars"></i>
            </button>
            <a href="/" class="navbar-brand">
                <div class="brand-logo">
                    <div class="logo-icon">
                        <i class="fas fa-brain"></i>
                    </div>
                </div>
                <span class="brand-name">StudyWise</span>
            </a>
        </div>

        <!-- Center Section: Smart Search Bar -->
        <div class="navbar-center">
            <div class="search-container">
                <div class="search-wrapper">
                    <span class="search-icon">
                        <i class="fas fa-search"></i>
                    </span>
                    <input 
                        type="text" 
                        class="search-input" 
                        id="searchInput"
                        placeholder="Search videos, topics, courses, or notes..."
                        autocomplete="off"
                    >
                    <button class="voice-search-btn" id="voiceSearchBtn" title="Voice Search">
                        <i class="fas fa-microphone"></i>
                    </button>
                    <div class="search-suggestions" id="searchSuggestions" style="display: none;">
                        <div class="suggestions-header" style="display: flex; justify-content: space-between; align-items: center;">
                            <span class="recent-label">Recent Searches</span>
                            <button type="button" class="clear-recent-btn" id="clearRecentSearchesBtn" style="background: none; border: none; font-size: 0.72rem; color: #4f46e5; font-weight: 600; cursor: pointer; padding: 0;">Clear</button>
                        </div>
                        <div class="suggestions-list" id="suggestionsList"></div>
                        <div class="suggestions-divider"></div>
                        <div class="suggestions-header">
                            <span class="trending-label">Trending Topics</span>
                        </div>
                        <div class="trending-list" id="trendingList"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Section: User Actions -->
        <div class="navbar-right">
            <!-- Mobile Search Trigger -->
            <button class="nav-action-btn mobile-search-trigger" id="mobileSearchTriggerBtn" title="Search">
                <i class="fas fa-search"></i>
            </button>

            <!-- Notifications -->
            <div class="nav-action-item notifications-container">
                <button class="nav-action-btn notification-btn" id="notificationBtn" title="Notifications">
                    <i class="fas fa-bell"></i>
                    <span class="notification-badge" id="notificationBadge" style="display: none;">0</span>
                </button>
                <div class="dropdown-panel notification-panel" id="notificationPanel" style="display: none;">
                    <div class="panel-header" style="display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid #f1f5f9;">
                        <h6 style="margin: 0; font-size: 0.9rem; font-weight: 700; color: #0f172a;">Notifications</h6>
                        <div style="display: flex; align-items: center; gap: 10px;">
                            <button id="markAllReadBtn" style="background: none; border: none; font-size: 0.72rem; color: #4f46e5; font-weight: 600; cursor: pointer; padding: 0;">Mark all read</button>
                            <button class="close-panel-btn" style="background: none; border: none; color: #94a3b8; cursor: pointer; padding: 0;">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                    </div>
                    <div class="panel-body" id="notificationPanelBody">
                        <div style="padding: 24px; text-align: center; color: #94a3b8; font-size: 0.8rem;">
                            <div class="spinner-border spinner-border-sm text-primary mb-2"></div>
                            <div>Loading notifications...</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- User Profile -->
            <div class="nav-action-item profile-container">
                <button class="nav-action-btn profile-btn" id="profileBtn" title="Profile Menu">
                    <div class="profile-avatar">
                        <img src="https://ui-avatars.com/api/?name={{ session.user_name|urlencode }}&background=4F46E5&color=fff&bold=true" alt="Profile">
                        <span class="online-indicator"></span>
                    </div>
                </button>
                <div class="dropdown-panel profile-panel" id="profilePanel" style="display: none;">
                    <div class="panel-header profile-header">
                        <div class="profile-info">
                            <img src="https://ui-avatars.com/api/?name={{ session.user_name|urlencode }}&background=4F46E5&color=fff&bold=true" alt="Profile" class="profile-img">
                            <div>
                                <p class="profile-name">{{ session.user_name }}</p>
                                <p class="profile-email">{{ session.user_email }}</p>
                            </div>
                        </div>
                    </div>
                    <div class="panel-body">
                        <a href="/settings" class="dropdown-item">
                            <i class="fas fa-user"></i>
                            <span>Profile and settings</span>
                        </a>
                        <a href="/my-learning" class="dropdown-item">
                            <i class="fas fa-book-open"></i>
                            <span>My learning</span>
                        </a>
                    </div>
                    <div class="panel-footer">
                        <button class="logout-btn" id="logoutBtn">
                            <i class="fas fa-sign-out-alt"></i>
                            <span>Log out</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Mobile Menu Toggle -->
            <button class="nav-action-btn hamburger-btn" id="hamburgerBtn" title="Menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </div>
</nav>

<!-- Mobile Search Panel -->
<div class="mobile-search-panel" id="mobileSearchPanel" style="display: none;">
    <div class="mobile-search-wrapper">
        <button class="close-search-btn" id="closeSearchBtn">
            <i class="fas fa-arrow-left"></i>
        </button>
        <input 
            type="text" 
            class="mobile-search-input" 
            id="mobileSearchInput"
            placeholder="Search..."
            autocomplete="off"
        >
        <button class="mobile-voice-btn" id="mobileVoiceBtn">
            <i class="fas fa-microphone"></i>
        </button>
    </div>
    <div class="mobile-suggestions" id="mobileSuggestions"></div>
</div>

<!-- Mobile Menu Overlay -->
<div class="mobile-menu-overlay" id="mobileMenuOverlay" style="display: none;">
    <div class="mobile-menu" id="mobileMenu">
        <div class="mobile-menu-header">
            <h6>Menu</h6>
            <button class="close-menu-btn" id="closeMenuBtn">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="mobile-menu-items">
            <a href="/dashboard" class="mobile-menu-item">
                <i class="fas fa-book-open"></i>
                <span>Dashboard</span>
            </a>
            <a href="/recommended-videos" class="mobile-menu-item">
                <i class="fas fa-play-circle"></i>
                <span>Recommended Videos</span>
            </a>
            <a href="/progress" class="mobile-menu-item">
                <i class="fas fa-chart-line"></i>
                <span>Progress</span>
            </a>
            <a href="/quiz-history" class="mobile-menu-item">
                <i class="fas fa-history"></i>
                <span>Quiz History</span>
            </a>
            <a href="/settings" class="mobile-menu-item">
                <i class="fas fa-cog"></i>
                <span>Settings</span>
            </a>
        </div>
    </div>
</div>

<!-- Load CSS and JS -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="{{ url_for('static', filename='css/navbar.css') }}">
<script src="{{ url_for('static', filename='js/navbar.js') }}"></script>
